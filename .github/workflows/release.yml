name: Release

# Builds the distribution (`cargo xtask dist`: the CLI, the prebuilt runtimes
# and the embedding SDKs) on macOS, Linux and Windows, and publishes it as a
# GitHub release.
#
# Its parts build in parallel jobs (`cargo xtask dist --part`): each OS's
# native runtimes, the iOS runtimes and SDK (macOS), and once for all three
# the web and Android runtimes, the same files wherever they are built. The
# `package` jobs then merge each OS's archive from its parts.
#
# - Pushing a tag `vX.Y.Z` (the workspace version in Cargo.toml) builds every
#   platform and, once all of them have built, creates a draft release with
#   their archives; publish it from the releases page.
# - Running it by hand without a tag builds the archives only (workflow
#   artifacts): a dry run before tagging. With a tag it releases that tag.
# - Pull requests that change this workflow or xtask build the archives
#   only, so a broken distribution shows before a release.
#
# Asset names carry no version (`nsh-macos-arm64.tar.gz`, each with a
# `.sha256`), so `releases/latest/download/<asset>` always resolves: the
# installers (`website/public/install.sh`, `install.ps1`, also attached to
# each release), mise's `github:` backend and the Scoop manifest download by
# that name. Every archive holds one directory, `nsh/`, laid out as
# `dist/nsh`. Publishing the draft runs `packages.yml` (Homebrew).

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/packages/**"
      - "crates/xtask/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0); empty: build only"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  dist:
    name: dist (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS runtime is built for this machine (Apple silicon).
          - name: macos-arm64
            part: native
            os: macos-15
          # 24.04 has GTK 4.14 and Pango 1.52+, what the Linux runtime needs;
          # its binaries need glibc 2.39 and GTK 4.14 or newer where they run.
          - name: linux-x86_64
            part: native
            os: ubuntu-24.04
          - name: windows-x86_64
            part: native
            os: windows-latest
          # The iOS runtimes and SDK need Xcode.
          - name: ios
            part: ios
            os: macos-15
          # The web and Android runtimes, for every OS's archive.
          - name: shared
            part: shared
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release run builds the tag, never the branch it was started on.
          ref: ${{ env.TAG || github.ref }}

      - name: Check the version
        if: env.TAG != ''
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG does not match the workspace version $version"
            exit 1
          fi

      # Temporary directories (tests, tools) outside the checkout.
      - name: Set up the environment
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - name: Set up Windows
        if: runner.os == 'Windows'
        run: |
          # QuickJS is C: bindgen needs libclang, which the image's LLVM has.
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          # rustc can overflow its default stack on the `windows` crate.
          echo "RUST_MIN_STACK=268435456" >> "$GITHUB_ENV"

      # QuickJS is C (bindgen needs libclang); the Linux runtime links GTK 4,
      # the GPUI runtime X11, Wayland, xkbcommon, fontconfig and FreeType,
      # GTK 3 and WebKitGTK 4.1 (web views) and GStreamer (videos).
      - name: Install clang, GTK 4 and GPUI's libraries
        if: runner.os == 'Linux' && matrix.part == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # QuickJS is C, also for WebAssembly: its build needs upstream clang
      # and `llvm-ar`.
      - name: Install clang
        if: matrix.part == 'shared'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev
          echo "CC_wasm32_unknown_unknown=/usr/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=/usr/bin/llvm-ar" >> "$GITHUB_ENV"

      # The Android runtime: `javac` + `d8` (Java 17), the SDK's
      # `platforms;android-35` and an NDK (the images have the SDK and NDKs).
      - uses: actions/setup-java@v4
        if: matrix.part == 'shared'
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android platform
        if: matrix.part == 'shared'
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager* | head -1)
            yes | "$sdkmanager" "platforms;android-35" > /dev/null || true
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          ls "$ANDROID_HOME/ndk" || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.part == 'shared' && 'wasm32-unknown-unknown' || '' }}

      # Dependencies only (the workspace's own crates are always rebuilt),
      # one cache per job: their targets and features differ.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
          workspaces: |
            . -> target
            crates/gpui -> target

      - name: Build the distribution
        run: cargo xtask dist --part ${{ matrix.part }} -v

      # The packaged CLI makes and bundles a new app.
      - name: Smoke test
        if: matrix.part == 'native'
        run: |
          nsh=dist/nsh/bin/nsh
          [[ "$RUNNER_OS" != Windows ]] || nsh=dist/nsh/bin/nsh.exe
          "$nsh" --version
          app="$RUNNER_TEMP/smoke-app"
          "$nsh" init "$app"
          "$nsh" build "$app" -o "$RUNNER_TEMP/smoke-out" --release
          ls "$RUNNER_TEMP/smoke-out"

      # A tar keeps the executable bits and the frameworks' symbolic links,
      # which artifacts lose.
      - name: Archive the part
        run: |
          [[ "${{ matrix.part }}" != native ]] || cp README.md LICENSE-APACHE dist/nsh/
          find dist/nsh -type f | sort
          tar -cf "$RUNNER_TEMP/part.tar" -C dist nsh

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.name }}
          path: ${{ runner.temp }}/part.tar
          if-no-files-found: error

  package:
    name: package (${{ matrix.name }})
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        name: [macos-arm64, linux-x86_64, windows-x86_64]
    runs-on: ubuntu-latest
    env:
      ARCHIVE: nsh-${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts

      - name: Package
        run: |
          mkdir -p assets
          cd assets
          for part in "${{ matrix.name }}" shared; do
            tar -xf "../parts/part-$part/part.tar"
          done
          [[ "${{ matrix.name }}" != macos-arm64 ]] || tar -xf ../parts/part-ios/part.tar
          find nsh -type f | sort
          if [[ "${{ matrix.name }}" == windows-x86_64 ]]; then
            zip -qry "$ARCHIVE.zip" nsh
            sha256sum "$ARCHIVE.zip" > "$ARCHIVE.zip.sha256"
          else
            tar -czf "$ARCHIVE.tar.gz" nsh
            sha256sum "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          fi
          # The embedding SDKs on their own, for native apps that embed nsh
          # and need no CLI (iOS with macOS's archive, Android with Linux's).
          embed() {
            local name="nsh-embed-$1"
            mkdir -p "$name"
            cp -R "nsh/embed/$1/." "$name/"
            zip -qry "$name.zip" "$name"
            sha256sum "$name.zip" > "$name.zip.sha256"
          }
          [[ "${{ matrix.name }}" != macos-arm64 ]] || embed ios
          [[ "${{ matrix.name }}" != linux-x86_64 ]] || embed android
          rm -rf nsh nsh-embed-*/
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: nsh-${{ matrix.name }}
          path: assets/*
          if-no-files-found: error

  release:
    name: Release
    needs: package
    if: inputs.tag != '' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: nsh-*
          path: assets
          merge-multiple: true

      # The installers go with the archives they download, and Scoop installs
      # from the manifest attached to the latest release:
      # `scoop install https://github.com/<repo>/releases/latest/download/nsh.json`.
      - name: Add the installers and the Scoop manifest
        run: |
          cp website/public/install.sh website/public/install.ps1 assets/
          read -r hash _ < assets/nsh-windows-x86_64.zip.sha256
          # shellcheck disable=SC2016 # envsubst's list of variables
          NSH_VERSION="${TAG#v}" NSH_HASH="$hash" NSH_REPO="$GITHUB_REPOSITORY" \
            envsubst '$NSH_VERSION $NSH_HASH $NSH_REPO' < .github/packages/nsh.json > assets/nsh.json
          cat assets/nsh.json

      # Created only after every platform has built; a draft until it is
      # published by hand.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: nsh ${{ env.TAG }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: assets/*
